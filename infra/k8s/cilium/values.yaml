# ==============================================================================
# Cilium NetworkPolicy chart values
#
# This chart now manages ONLY CiliumNetworkPolicies for the Task API platform.
# Gateway and HTTPRoute resources are NOT managed here. Envoy Gateway is the
# Gateway API controller on both kind and AKS.
#
# Design decisions:
#   - Cilium is installed separately (e.g., kind cluster bootstrap or AKS
#     Azure CNI Powered by Cilium). This chart does not install Cilium itself.
#   - Envoy Gateway is responsible for GatewayClass=eg, Gateway, and routing.
#   - HTTPRoutes are created by deployment scripts (backend-deploy.sh,
#     frontend-deploy.sh) and managed by Argo Rollouts during canary releases.
#   - NetworkPolicies are enabled with default-deny to enforce least privilege.
# ==============================================================================

networkPolicies:
  # Master switch for all policies
  enabled: true

  # Namespace names used across policies
  taskApiNamespace: task-api
  cloudflaredNamespace: cloudflared
  # Envoy Gateway namespace (for future policy if needed)
  envoyGatewayNamespace: envoy-gateway-system
  dnsNamespace: kube-system

  # Default-deny all traffic for task-api pods. This requires explicit allow
  # policies for every legitimate flow.
  defaultDeny: true

  # Allow DNS resolution from task-api pods to kube-dns
  dnsEgress: true

  # Cloudflared egress rules (DNS, Tunnel, HTTPS, frontend)
  cloudflaredEgress: true
  cloudflaredToFrontend: true

  # Allow Envoy Gateway ingress to frontend pods (Gateway API traffic)
  # Note: With Envoy Gateway, traffic originates from Envoy pods in the
  # `envoy-gateway-system` namespace, not Cilium's `ingress` identity.
  # This policy must be updated to match that source.
  gatewayToFrontend: true

  # Allow frontend pods to talk to backend pods
  frontendToBackend: true

  # Allow backend pods to talk to PostgreSQL
  backendToPostgres: true

  # Pod selectors used by policies
  frontendSelector:
    matchLabels:
      app: frontend
  backendSelector:
    matchLabels:
      app: backend
  postgresSelector:
    matchLabels:
      app: postgres
  cloudflaredSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  dnsSelector:
    matchLabels:
      k8s-app: kube-dns
