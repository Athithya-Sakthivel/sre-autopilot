# ---------------------------------------------------------------------------
# CD — Backend
#
# Trigger: automatic on successful ci-backend run on main.
# Uses pipeline resource ciBackend.sourceCommit for image tag.
#
# Deploy logic:
#   - No Rollout        -> stable deployment only
#   - Healthy Rollout   -> canary deployment
#   - Degraded Rollout  -> stable deployment only to recover
#
# No environment approval.
# ---------------------------------------------------------------------------

trigger: none

resources:
  pipelines:
    - pipeline: ciBackend
      source: aks-canary-platform-ci-backend
      trigger:
        branches:
          include:
            - main

variables:
  - group: terraform-vars
  - name: backendNamespace
    value: "task-api"
  - name: argoRolloutsVersion
    value: "1.8.4"
  - name: k6Version
    value: "2.1.0"

pool:
  vmImage: "ubuntu-24.04"

stages:
  - stage: build
    displayName: "Build, scan and push backend image"
    condition: succeeded()
    jobs:
      - job: build_push
        displayName: "Build / Trivy scan / push"
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1
            fetchTags: false
            submodules: false
            lfs: false

          - template: /azure-pipelines/templates/docker-build-push.yaml
            parameters:
              dockerfilePath: "services/backend/Dockerfile"
              contextPath: "services/backend"
              imageRepository: "backend"
              imageTag: "$(resources.pipeline.ciBackend.sourceCommit)"
              containerRegistry: "$(containerRegistry)"
              azureSubscription: "azdo-oidc-cd"

  - stage: deploy
    displayName: "Canary deploy backend"
    dependsOn: build
    condition: succeeded()
    jobs:
      - job: canary_deploy
        displayName: "Progressive backend canary"
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1
            fetchTags: false
            submodules: false
            lfs: false

          - bash: |
              set -euo pipefail
              version="$(argoRolloutsVersion)"
              work="$(Agent.TempDirectory)/argo-rollouts"
              archive="kubectl-argo-rollouts-linux-amd64"
              checksums="argo-rollouts-checksums.txt"
              base_url="https://github.com/argoproj/argo-rollouts/releases/download/v${version}"

              mkdir -p "$work"
              curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 \
                --proto '=https' --tlsv1.2 \
                -o "$work/$archive" "$base_url/$archive"
              curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 \
                --proto '=https' --tlsv1.2 \
                -o "$work/$checksums" "$base_url/$checksums"

              cd "$work"
              checksum_line="$(grep -E '^[0-9a-f]{64}[[:space:]]+[*]?kubectl-argo-rollouts-linux-amd64$' "$checksums")"
              test -n "$checksum_line"
              printf '%s\n' "$checksum_line" | sha256sum --check --status -

              chmod +x "$archive"
              sudo install -m 0755 "$archive" /usr/local/bin/kubectl-argo-rollouts
              kubectl argo rollouts version
            displayName: "Install pinned Argo Rollouts plugin"

          - bash: |
              set -euo pipefail
              version="$(k6Version)"
              work="$(Agent.TempDirectory)/k6"
              archive="k6-v${version}-linux-amd64.tar.gz"
              checksums="k6-v${version}-checksums.txt"
              base_url="https://github.com/grafana/k6/releases/download/v${version}"

              mkdir -p "$work"
              curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 \
                --proto '=https' --tlsv1.2 \
                -o "$work/$archive" "$base_url/$archive"
              curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 \
                --proto '=https' --tlsv1.2 \
                -o "$work/$checksums" "$base_url/$checksums"

              cd "$work"
              checksum_line="$(grep -E '^[0-9a-f]{64}[[:space:]]+[*]?k6-v'"${version}"'-linux-amd64\.tar\.gz$' "$checksums")"
              test -n "$checksum_line"
              printf '%s\n' "$checksum_line" | sha256sum --check --status -

              tar -xzf "$archive"
              test -x "$work/k6-v${version}-linux-amd64/k6"
              sudo install -m 0755 "$work/k6-v${version}-linux-amd64/k6" /usr/local/bin/k6
              k6 version
            displayName: "Install pinned k6"

          - task: AzureCLI@2
            displayName: "Deploy backend (auto stable/canary)"
            inputs:
              azureSubscription: "azdo-oidc-cd"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks get-credentials \
                  --resource-group "$(aksResourceGroup)" \
                  --name "$(aksClusterName)" \
                  --overwrite-existing

                export NAMESPACE="$(backendNamespace)"
                export IMAGE_REPO="$(containerRegistry).azurecr.io/backend"
                export K6_BIN="k6"

                COMMIT="$(resources.pipeline.ciBackend.sourceCommit)"
                IMAGE="$(containerRegistry).azurecr.io/backend:${COMMIT}"

                if kubectl get rollout backend -n "$NAMESPACE" >/dev/null 2>&1; then
                  PHASE="$(kubectl get rollout backend -n "$NAMESPACE" -o json | jq -r '.status.phase // "Unknown"')"

                  if [[ "$PHASE" == "Healthy" ]]; then
                    echo "Healthy rollout exists: running canary deployment"
                    bash azure-pipelines/scripts/backend-deploy.sh \
                      --canary \
                      --image "$IMAGE" \
                      --qps 2 \
                      --p95-threshold 20000 \
                      --error-threshold 0.05 \
                      --duration 15s \
                      --observation-duration 15s
                  else
                    echo "Rollout exists but is $PHASE: running stable deployment to recover"
                    bash azure-pipelines/scripts/backend-deploy.sh \
                      --stable \
                      --stable-tag "$COMMIT"
                  fi
                else
                  echo "No rollout found: running stable deployment"
                  bash azure-pipelines/scripts/backend-deploy.sh \
                    --stable \
                    --stable-tag "$COMMIT"
                fi
