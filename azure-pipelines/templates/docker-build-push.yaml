# ---------------------------------------------------------------------------
# Reusable template: Build, scan, and push Docker image.
# No image metadata artifact or digest recording.
# Uses plain Docker build + Trivy CRITICAL scan + ACR push.
# ---------------------------------------------------------------------------

parameters:
  - name: dockerfilePath
    type: string
  - name: contextPath
    type: string
  - name: imageRepository
    type: string
  - name: imageTag
    type: string
  - name: containerRegistry
    type: string
  - name: azureSubscription
    type: string

steps:
  - bash: |
      set -euo pipefail

      registry='${{ parameters.containerRegistry }}'
      repository='${{ parameters.imageRepository }}'
      tag='${{ parameters.imageTag }}'

      [[ "$registry" =~ ^[a-z0-9]{5,50}$ ]]
      [[ "$repository" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]
      [[ "$tag" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]
    displayName: "Validate image coordinates"

  - bash: |
      set -euo pipefail

      image='${{ parameters.containerRegistry }}.azurecr.io/${{ parameters.imageRepository }}:${{ parameters.imageTag }}'

      docker build \
        --pull \
        --file '${{ parameters.dockerfilePath }}' \
        --tag "$image" \
        '${{ parameters.contextPath }}'

      docker image inspect "$image" >/dev/null
    displayName: "Build image"

  - bash: |
      set -euo pipefail

      trivy_version="0.74.0"
      trivy_sha256="2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
      archive="trivy_${trivy_version}_Linux-64bit.tar.gz"
      url="https://github.com/aquasecurity/trivy/releases/download/v${trivy_version}/${archive}"

      work="$(Agent.TempDirectory)/trivy"
      image='${{ parameters.containerRegistry }}.azurecr.io/${{ parameters.imageRepository }}:${{ parameters.imageTag }}'

      mkdir -p "$work"

      curl --fail --silent --show-error --location --retry 3 \
        --retry-all-errors --connect-timeout 10 \
        --proto '=https' --tlsv1.2 \
        -o "$work/$archive" "$url"

      printf '%s  %s\n' "$trivy_sha256" "$work/$archive" \
        | sha256sum --check --status

      tar -xzf "$work/$archive" -C "$work"
      test -x "$work/trivy"

      "$work/trivy" image \
        --scanners vuln \
        --severity CRITICAL \
        --ignore-unfixed \
        --exit-code 1 \
        --format json \
        --output "$work/trivy-report.json" \
        "$image"
    displayName: "Trivy CRITICAL scan"

  - task: AzureCLI@2
    displayName: "Push image to ACR"
    inputs:
      azureSubscription: "${{ parameters.azureSubscription }}"
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        registry='${{ parameters.containerRegistry }}'
        repository='${{ parameters.imageRepository }}'
        tag='${{ parameters.imageTag }}'

        image="${registry}.azurecr.io/${repository}:${tag}"

        az acr login --name "$registry"
        docker push "$image"
